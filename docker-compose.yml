services:
  db:
    image: postgres:15-alpine
    container_name: vmt-db
    environment:
      POSTGRES_DB: vehicle_maintenance
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vmt-network

  backend:
    build: ./backend
    container_name: vmt-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGINS: http://localhost
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/maintenance-types"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vmt-network

  frontend:
    build: ./frontend
    container_name: vmt-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - vmt-network

networks:
  vmt-network:
    driver: bridge

volumes:
  db_data:
